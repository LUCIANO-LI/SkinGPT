<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinAI - 智能皮肤诊断系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #ffffff;
            --secondary-bg: #f3f4f6; /* 更高对比度浅灰 */
            --accent-bg: rgba(255, 255, 255, 0.92);
            --text-primary: #0f172a; /* 更深的文字颜色 */
            --text-secondary: #334155; /* 白天模式提升可读性 */
            --text-muted: #64748b;
            --border-color: #cbd5e1; /* 更明显的边框 */
            --shadow-light: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-medium: 0 10px 30px rgba(0,0,0,0.12);
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --gradient-accent: linear-gradient(135deg, #6366f1, #8b5cf6);
            --gradient-hero: linear-gradient(135deg, #5b6ee2 0%, #764ba2 100%);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        [data-theme="dark"] {
            --primary-bg: #0f172a;
            --secondary-bg: #1e293b;
            --accent-bg: rgba(30, 41, 59, 0.95);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-light: 0 4px 20px rgba(0,0,0,0.25);
            --shadow-medium: 0 10px 30px rgba(0,0,0,0.35);
            --gradient-hero: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gradient-hero);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: all 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--secondary-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gradient-accent);
            border-radius: 4px;
        }

        /* 顶部导航 */
        .navbar {
            background: var(--accent-bg);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-light);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .theme-toggle {
            background: var(--secondary-bg);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            width: 60px;
            height: 32px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            padding: 0 4px;
        }

        .theme-toggle::before {
            content: '';
            width: 20px;
            height: 20px;
            background: var(--gradient-accent);
            border-radius: 50%;
            position: absolute;
            transition: transform 0.3s ease;
            transform: translateX(0);
        }

        [data-theme="dark"] .theme-toggle::before {
            transform: translateX(24px);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 50px;
            transition: all 0.3s ease;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
        }

        .user-info:hover {
            background: var(--gradient-accent);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--gradient-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: 700;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .user-plan {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* 首页内容 */
        .home-page {
            display: block;
            min-height: calc(100vh - 80px);
        }

        .hero-section {
            text-align: center;
            padding: 120px 32px 80px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .float-item {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .float-item:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .float-item:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 40%;
            right: 15%;
            animation-delay: 2s;
        }

        .float-item:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 30%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .hero-title {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ffffff; /* 英雄区在渐变背景上使用纯白文字提高可读性 */
            margin-bottom: 24px;
            letter-spacing: -0.02em;
            text-shadow: 0 8px 24px rgba(0,0,0,0.18);
            opacity: 0;
            animation: slideInUp 1s ease 0.2s forwards;
        }

        .hero-subtitle {
            font-size: 1.4rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 48px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            animation: slideInUp 1s ease 0.4s forwards;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-container {
            opacity: 0;
            animation: slideInUp 1s ease 0.6s forwards;
        }

        .cta-button {
            background: var(--gradient-accent);
            color: white;
            border: none;
            padding: 24px 48px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 50px rgba(99, 102, 241, 0.4);
        }

        .cta-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        /* 已移除统计数据区域样式 */

        /* 检测页面 */
        .detection-page {
            display: none;
            min-height: calc(100vh - 80px);
            background: var(--secondary-bg);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 32px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 60px;
        }

        .content-area {
            background: var(--primary-bg);
            border-radius: 24px;
            padding: 60px;
            box-shadow: var(--shadow-medium);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .back-button {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
            padding: 16px 32px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            margin-bottom: 40px;
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            background: var(--gradient-accent);
            color: white;
            border-color: transparent;
            transform: translateX(-4px);
        }

        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        /* 上传区域 */
        .upload-zone {
            border: 3px dashed var(--border-color);
            border-radius: 20px;
            padding: 80px 40px;
            text-align: center;
            background: var(--secondary-bg);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .upload-zone:hover::before {
            left: 100%;
        }

        .upload-zone:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
            transform: scale(1.02);
        }

        .upload-zone.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.05);
        }

        .upload-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            background: var(--gradient-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            transition: all 0.3s ease;
        }

        .upload-zone:hover .upload-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .upload-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .upload-hint {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .file-input {
            display: none;
        }

        /* 预览图片 */
        .preview-container {
            margin: 40px 0;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 20px;
            box-shadow: var(--shadow-medium);
            display: none;
            transition: all 0.3s ease;
        }

        .preview-image:hover {
            transform: scale(1.02);
        }

        /* 分析按钮 */
        .analyze-button {
            background: var(--gradient-accent);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s ease;
            width: 100%;
            margin: 32px 0;
            opacity: 0.5;
            transform: translateY(4px);
            position: relative;
            overflow: hidden;
        }

        .analyze-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .analyze-button:not(:disabled)::before {
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .analyze-button:not(:disabled) {
            opacity: 1;
            transform: translateY(0);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
        }

        .analyze-button:not(:disabled):hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.4);
        }

        .analyze-button:disabled {
            cursor: not-allowed;
        }

        /* 加载状态 */
        .loading {
            display: none;
            text-align: center;
            padding: 60px 0;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border-color);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 32px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* 结果区域 */
        .results-section {
            display: none;
            margin-top: 40px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: var(--secondary-bg);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-medium);
        }

        .metric-label {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .metric-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #16a34a, #10b981);
            border-radius: 4px;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .summary-card {
            background: var(--primary-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-light);
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 32px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-item:hover {
            background: var(--secondary-bg);
            margin: 0 -20px;
            padding: 16px 20px;
            border-radius: 12px;
        }

        /* 评级徽章 */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .2px;
            margin-left: 8px;
            border: 1px solid rgba(0,0,0,0.06);
        }
        .badge--green { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
        .badge--yellow { background: #fffbeb; color: #92400e; border-color: #fde68a; }
        .badge--orange { background: #fff7ed; color: #7c2d12; border-color: #fdba74; }
        .badge--red { background: #fef2f2; color: #991b1b; border-color: #fecaca; }

        .summary-label {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .summary-value {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* 侧边栏 */
        .sidebar-card {
            background: var(--primary-bg);
            border-radius: 20px;
            padding: 32px;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .sidebar-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .profile-stats {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stat-item-sidebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--secondary-bg);
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .stat-item-sidebar:hover {
            background: var(--gradient-accent);
            color: white;
            transform: translateX(4px);
        }

        .stat-label-sidebar {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .stat-value-sidebar {
            font-weight: 700;
        }

        .history-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: var(--secondary-bg);
            margin: 0 -16px;
            padding: 16px;
            border-radius: 8px;
        }

        .history-date {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .history-result {
            font-size: 0.9rem;
            font-weight: 700;
            color: #059669;
        }

        .reset-button {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            margin-top: 24px;
        }

        .reset-button:hover {
            background: var(--gradient-accent);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            
            .sidebar {
                order: -1;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 24px;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                padding: 0 20px;
            }
            
            .user-details {
                display: none;
            }
            
            .main-container {
                padding: 40px 20px;
            }
            
            .content-area {
                padding: 40px 24px;
            }
            
            .hero-title {
                font-size: 3rem;
            }

            .hero-section {
                padding: 80px 20px 60px;
            }

            .stats-section {
                margin: 40px 20px;
                padding: 60px 20px;
            }
            
            .result-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                grid-template-columns: 1fr;
            }
        }

        /* 微交互动画 */
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .8;
            }
        }

        /* 页面切换动画 */
        .page-transition {
            opacity: 0;
            transform: translateY(20px);
            animation: pageSlideIn 0.6s ease forwards;
        }

        @keyframes pageSlideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* AI建议加载提示与进度条 */
        .ai-advice-loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        .ai-advice-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        .ai-progress {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
        }
        .ai-progress-bar {
            width: 30%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 999px;
            animation: progressIndeterminate 1.4s ease-in-out infinite;
        }
        @keyframes progressIndeterminate {
            0% { transform: translateX(-120%); }
            50% { transform: translateX(20%); }
            100% { transform: translateX(220%); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="goBackHome()">
                SkinAI
            </div>
            <div class="nav-controls">
                <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()"></div>
                <div class="user-info" onclick="toggleUserProfile()">
                    <div class="avatar">U</div>
                    <div class="user-details">
                        <div class="user-name">User</div>
                        <div class="user-plan">Premium</div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 首页内容 -->
    <div class="home-page" id="homePage">
        <!-- 英雄区域 -->
        <section class="hero-section">
            <div class="floating-elements">
                <div class="float-item"></div>
                <div class="float-item"></div>
                <div class="float-item"></div>
            </div>
            
            <h1 class="hero-title">AI智能皮肤诊断</h1>
            <p class="hero-subtitle">利用前沿人工智能技术，为您提供专业、精准的皮肤健康分析</p>
            
            <div class="cta-container">
                <button type="button" class="cta-button" onclick="startDetection()">
                    开始检测皮肤
                </button>
            </div>
        </section>

        
    </div>

    <!-- 检测页面 -->
    <div class="detection-page page-transition" id="detectionPage">
        <div class="main-container">
            <!-- 主内容区域 -->
            <div class="content-area">
                <button type="button" class="back-button" onclick="goBackHome()">
                    ← 返回首页
                </button>

                <div class="header-section">
                    <h1 class="main-title">AI皮肤诊断</h1>
                    <p class="subtitle">上传您的皮肤照片，获得专业的AI智能分析报告</p>
                </div>

                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">+</div>
                    <div class="upload-text">点击上传或拖拽照片至此</div>
                    <div class="upload-hint">支持 JPG、PNG 格式，最大 20MB</div>
                    <input type="file" class="file-input" id="fileInput" accept="image/*">
                </div>

                <div class="preview-container">
                    <img class="preview-image" id="previewImage" alt="预览">
                </div>

                <button type="button" class="analyze-button" id="analyzeBtn" disabled>
                    开始分析
                </button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p class="loading-text">正在分析，请稍候...</p>
                </div>

                <div class="results-section" id="resultsSection">
                    

                    

                    <div class="summary-card" id="taskScoresCard" style="display:none;">
                        <div class="summary-title">六项指标评分</div>
                        <div id="taskScoresList"></div>
                    </div>

                    

                    <button type="button" class="reset-button" onclick="resetAnalysis()">重新分析</button>
                </div>
            </div>

            <!-- 侧边栏 -->
            <div class="sidebar">
                <div class="sidebar-card">
                    <div class="sidebar-title">今日建议</div>
                    <div style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.7;">
                        <p style="margin-bottom: 16px;">注意补水保湿</p>
                        <p style="margin-bottom: 16px;">使用温和洁面产品</p>
                        <p style="margin-bottom: 16px;">做好防晒工作</p>
                        <p>保持均衡饮食</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const homePage = document.getElementById('homePage');
        const detectionPage = document.getElementById('detectionPage');
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const resultsSection = document.getElementById('resultsSection');
        const themeToggle = document.getElementById('themeToggle');
        let selectedFile = null;
        const API_BASE = localStorage.getItem('SKIN_API_BASE') || 'http://127.0.0.1:7860';

        // 主题切换功能
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            // 添加切换动画
            document.body.style.transition = 'all 0.3s ease';
            setTimeout(() => {
                document.body.style.transition = '';
            }, 300);
        }

        // 初始化主题
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // 页面切换功能
        function startDetection(e) {
            if (e && e.preventDefault) e.preventDefault();
            homePage.style.display = 'none';
            detectionPage.style.display = 'block';
            detectionPage.classList.add('page-transition');
            
            // 更新背景
            document.body.style.background = 'var(--secondary-bg)';
            
            setTimeout(() => {
                detectionPage.classList.remove('page-transition');
            }, 600);
        }

        function goBackHome(e) {
            if (e && e.preventDefault) e.preventDefault();
            detectionPage.style.display = 'none';
            homePage.style.display = 'block';
            homePage.classList.add('page-transition');
            
            // 恢复背景
            document.body.style.background = 'var(--gradient-hero)';
            
            resetAnalysis();
            
            setTimeout(() => {
                homePage.classList.remove('page-transition');
            }, 600);
        }

        // 已移除统计数字动画

        // 上传功能
        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                // 大小限制 20MB
                if (file.size > 20 * 1024 * 1024) {
                    showToast('图片超过 20MB，请选择更小的图片', 'error');
                    return;
                }
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                    analyzeBtn.disabled = false;
                    
                    // 添加预览动画
                    previewImage.style.opacity = '0';
                    previewImage.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        previewImage.style.transition = 'all 0.4s ease';
                        previewImage.style.opacity = '1';
                        previewImage.style.transform = 'scale(1)';
                    }, 100);
                };
                reader.readAsDataURL(file);
            }
        }

        // 分析功能
        analyzeBtn.addEventListener('click', startAnalysis);

        function startAnalysis(e) {
            if (e && e.preventDefault) e.preventDefault();
            if (!selectedFile) {
                showToast('请先选择图片', 'error');
                return;
            }

            loading.style.display = 'block';
            analyzeBtn.style.display = 'none';
            resultsSection.style.display = 'none';
            loading.classList.add('pulse');

            const form = new FormData();
            form.append('image', selectedFile);

            fetch(`${API_BASE}/analyze?use_tta=true`, {
                method: 'POST',
                body: form
            })
            .then(async (res) => {
                let data;
                try {
                    data = await res.json();
                } catch (_) {
                    throw new Error('后端返回非JSON数据');
                }
                if (!res.ok || data.error) {
                    throw new Error(data.error || `请求失败: ${res.status}`);
                }
                renderResults(data);
            })
            .catch((err) => {
                console.error(err);
                showToast(`分析失败：${err.message}`, 'error');
            })
            .finally(() => {
                loading.style.display = 'none';
                loading.classList.remove('pulse');
            });
        }

        function renderResults(data) {
            const derived = data.derived || {};
            const totalscore = typeof data.totalScore === 'number' ? data.totalScore : null;

            // 已移除“详细分析结果”模块，因此不再写入该模块相关字段

            resultsSection.style.display = 'block';

            // 渲染六项指标与建议
            renderTasksAndAdvice(data.analysis);

            updateStats();
        }

        // 已移除本地随机回退渲染

        function renderTasksAndAdvice(analysis) {
            const taskCard = document.getElementById('taskScoresCard');
            const adviceCard = document.getElementById('adviceCard');
            const list = document.getElementById('taskScoresList');
            const adviceContent = document.getElementById('adviceContent');

            if (!analysis) {
                taskCard.style.display = 'none';
                adviceCard.style.display = 'none';
                return;
            }

            // 任务列表
            list.innerHTML = '';
            (analysis.tasks || []).forEach(t => {
                const row = document.createElement('div');
                row.className = 'summary-item';
                const name = document.createElement('span');
                name.className = 'summary-label';
                name.textContent = `${t.emoji} ${t.name}`;
                const val = document.createElement('span');
                val.className = 'summary-value';
                val.textContent = `${t.score.toFixed(2)} / 3.0 (${t.level})`;
                row.appendChild(name);
                row.appendChild(val);
                list.appendChild(row);
            });

            taskCard.style.display = (analysis.tasks && analysis.tasks.length) ? 'block' : 'none';

            // 建议区块
            // 如果建议模块被移除，尝试向后端请求AI建议并追加在任务卡片下方
            if (!adviceCard || !adviceContent) {
                const userApiKey = localStorage.getItem('DEEPSEEK_API_KEY');

                // 若已存在上一次的 AI 建议容器，则先移除，避免重复叠加
                const existedAdvice = document.getElementById('aiAdviceContainer');
                if (existedAdvice) existedAdvice.remove();

                const adviceContainer = document.createElement('div');
                adviceContainer.id = 'aiAdviceContainer';
                adviceContainer.className = 'summary-card';
                const t = document.createElement('div');
                t.className = 'summary-title';
                t.textContent = 'AI护理建议(DeepSeek)';
                adviceContainer.appendChild(t);

                // 加载骨架：提示 + 进度条
                const loadingBox = document.createElement('div');
                loadingBox.id = 'aiAdviceLoading';
                const loadingRow = document.createElement('div');
                loadingRow.className = 'ai-advice-loading';
                const sp = document.createElement('div');
                sp.className = 'ai-advice-spinner';
                const tip = document.createElement('span');
                tip.textContent = '正在生成AI建议，请稍候…';
                loadingRow.appendChild(sp);
                loadingRow.appendChild(tip);
                const progress = document.createElement('div');
                progress.className = 'ai-progress';
                const bar = document.createElement('div');
                bar.className = 'ai-progress-bar';
                progress.appendChild(bar);
                loadingBox.appendChild(loadingRow);
                loadingBox.appendChild(progress);
                adviceContainer.appendChild(loadingBox);
                resultsSection.appendChild(adviceContainer);

                const showSetKeyHint = (msg) => {
                    const hint = document.createElement('div');
                    hint.style.color = 'var(--text-secondary)';
                    hint.style.lineHeight = '1.8';
                    hint.style.marginTop = '6px';
                    hint.textContent = msg;
                    const btn = document.createElement('button');
                    btn.className = 'reset-button';
                    btn.textContent = '设置/更换 DeepSeek Key';
                    btn.onclick = () => {
                        const key = prompt('请输入 DeepSeek API Key', userApiKey || '');
                        if (key) { localStorage.setItem('DEEPSEEK_API_KEY', key); showToast('已保存密钥，请重新分析', 'info'); }
                    };
                    adviceContainer.appendChild(hint);
                    adviceContainer.appendChild(btn);
                };

                fetch(`${API_BASE}/ai_advice`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // 同时通过自定义头传递，避免后端无法从 body 读取或被网关过滤
                        ...(userApiKey ? { 'X-DeepSeek-Key': userApiKey } : {})
                    },
                    body: JSON.stringify({
                        tasks: (analysis.tasks || []).map(t => ({ name: t.name, score: t.score })),
                        apiKey: userApiKey || undefined
                    })
                })
                .then(async res => {
                    let ai = null; let text = '';
                    try { ai = await res.json(); } catch (_) { try { text = await res.text(); } catch(_){} }
                    if (!res.ok || !ai || ai.error) {
                        showToast(`DeepSeek 建议获取失败：${(ai && ai.error) || res.status}`, 'error');
                        showSetKeyHint('未能获取AI建议。请确保网络可访问 api.deepseek.com，且已在本机或 localStorage 设置有效的 API Key。');
                        if (text) {
                            const pre = document.createElement('pre');
                            pre.style.whiteSpace = 'pre-wrap';
                            pre.style.fontFamily = 'monospace';
                            pre.style.fontSize = '0.9rem';
                            pre.textContent = text;
                            adviceContainer.appendChild(pre);
                        }
                        return;
                    }

                    // 移除加载骨架
                    const loadingNode = document.getElementById('aiAdviceLoading');
                    if (loadingNode) loadingNode.remove();

                    const data = ai.aiAdvice || {};
                    const overview = document.createElement('div');
                    overview.style.marginBottom = '12px';
                    overview.textContent = data.overview || '—';
                    adviceContainer.appendChild(overview);

                    if (Array.isArray(data.actions)) {
                        data.actions.forEach(action => {
                            const row = document.createElement('div');
                            row.className = 'summary-item';
                            const l = document.createElement('span');
                            l.className = 'summary-label';
                            l.textContent = action.title || '改善建议';
                            const r = document.createElement('span');
                            r.className = 'summary-value';
                            r.textContent = action.how || action.why || '';
                            row.appendChild(l); row.appendChild(r);
                            adviceContainer.appendChild(row);
                        });
                    }

                    if (Array.isArray(data.products) && data.products.length) {
                        const sub = document.createElement('div');
                        sub.style.fontWeight = '800';
                        sub.style.margin = '16px 0 8px';
                        sub.textContent = '推荐产品';
                        adviceContainer.appendChild(sub);
                        data.products.forEach(p => {
                            const row = document.createElement('div');
                            row.className = 'summary-item';
                            const l = document.createElement('span');
                            l.className = 'summary-label';
                            l.textContent = `${p.step || ''} · ${p.product_type || ''}`.trim();
                            const r = document.createElement('span');
                            r.className = 'summary-value';
                            const names = Array.isArray(p.examples) ? p.examples.join('、') : '';
                            r.textContent = names || p.reason || '';
                            row.appendChild(l); row.appendChild(r);
                            adviceContainer.appendChild(row);
                        });
                    }
                })
                .catch((e) => {
                    const loadingNode = document.getElementById('aiAdviceLoading');
                    if (loadingNode) loadingNode.remove();
                    showToast(`DeepSeek 调用异常：${e.message}`, 'error');
                    showSetKeyHint('网络异常或被拦截。你可以点击下面按钮设置密钥后重试。');
                });
                return;
            }
            adviceContent.innerHTML = '';
            const addGroup = (title, items) => {
                if (!items || !items.length) return;
                const section = document.createElement('div');
                section.style.marginBottom = '16px';
                const h = document.createElement('div');
                h.style.fontWeight = '800';
                h.style.marginBottom = '8px';
                h.textContent = title;
                section.appendChild(h);
                items.forEach(it => {
                    const li = document.createElement('div');
                    li.style.display = 'flex';
                    li.style.justifyContent = 'space-between';
                    li.style.padding = '8px 0';
                    const l = document.createElement('span');
                    l.className = 'summary-label';
                    l.textContent = it.task;
                    const r = document.createElement('span');
                    r.className = 'summary-value';
                    r.textContent = it.advice;
                    li.appendChild(l);
                    li.appendChild(r);
                    section.appendChild(li);
                });
                adviceContent.appendChild(section);
            };

            addGroup('重点改善项目', analysis.suggestions && analysis.suggestions.critical);
            addGroup('预防保养项目', analysis.suggestions && analysis.suggestions.preventive);
            addGroup('状况良好项目', analysis.suggestions && analysis.suggestions.good);

            adviceCard.style.display = adviceContent.children.length ? 'block' : 'none';
        }

        function showToast(message, type = 'info') {
            const notification = document.createElement('div');
            const bg = type === 'error' ? 'linear-gradient(135deg, #ef4444, #f97316)' : 'var(--primary-bg)';
            const color = type === 'error' ? '#fff' : 'var(--text-primary)';
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 32px;
                background: ${bg};
                color: ${color};
                padding: 16px 24px;
                border-radius: 12px;
                box-shadow: var(--shadow-medium);
                border: 1px solid var(--border-color);
                z-index: 1001;
                opacity: 0;
                transform: translateX(100px);
                transition: all 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.style.opacity = '1';
                notification.style.transform = 'translateX(0)';
            }, 50);
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100px)';
                setTimeout(() => document.body.removeChild(notification), 300);
            }, 3000);
        }

        function resetAnalysis(e) {
            if (e && e.preventDefault) e.preventDefault();
            previewImage.style.display = 'none';
            previewImage.src = '';
            analyzeBtn.style.display = 'block';
            analyzeBtn.disabled = true;
            resultsSection.style.display = 'none';
            fileInput.value = '';
            // 移除已渲染的 AI 建议容器，避免重复
            const existedAdvice = document.getElementById('aiAdviceContainer');
            if (existedAdvice) existedAdvice.remove();
            
            // 重置进度条
            document.querySelectorAll('.metric-fill').forEach(bar => {
                bar.style.width = '0%';
            });
        }

        function updateStats() { /* 侧边栏个人统计已移除，无需更新 */ }

        function toggleUserProfile() {
            // 可以添加用户资料弹窗或页面
            const message = '用户资料功能正在开发中...';
            
            // 创建自定义通知
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 32px;
                background: var(--primary-bg);
                color: var(--text-primary);
                padding: 16px 24px;
                border-radius: 12px;
                box-shadow: var(--shadow-medium);
                border: 1px solid var(--border-color);
                z-index: 1001;
                opacity: 0;
                transform: translateX(100px);
                transition: all 0.3s ease;
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '1';
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100px)';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

        // 页面滚动效果
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const navbar = document.querySelector('.navbar');
            
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                // 向下滚动
                navbar.style.transform = 'translateY(-100%)';
            } else {
                // 向上滚动
                navbar.style.transform = 'translateY(0)';
            }
            
            lastScrollTop = scrollTop;
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            
            // 添加页面加载动画
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.6s ease';
                document.body.style.opacity = '1';
            }, 100);
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + D 切换主题
            if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                e.preventDefault();
                toggleTheme();
            }
            
            // ESC 返回首页
            if (e.key === 'Escape' && detectionPage.style.display !== 'none') {
                goBackHome();
            }
        });

        // 视差滚动效果
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const parallax = document.querySelector('.floating-elements');
            if (parallax && homePage.style.display !== 'none') {
                parallax.style.transform = `translateY(${scrolled * 0.5}px)`;
            }
        });
    </script>
</body>
</html>
